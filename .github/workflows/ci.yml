name: Codechecker CI

on: [push, pull_request]

env:
  TZ: Australia/Sydney

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          # Highest php version supported by each branch, with main
          # (5.3dev until the MOODLE_503_STABLE cut) tested on both DBs.
          - php: 8.4
            moodle-branch: main
            database: pgsql
          - php: 8.4
            moodle-branch: main
            database: mariadb
          - php: 8.4
            moodle-branch: MOODLE_502_STABLE
            database: pgsql
          - php: 8.4
            moodle-branch: MOODLE_501_STABLE
            database: pgsql
          - php: 8.3
            moodle-branch: MOODLE_500_STABLE
            database: pgsql

          # Lowest php version supported by each branch.
          - php: 8.3
            moodle-branch: main
            database: pgsql
          - php: 8.3
            moodle-branch: MOODLE_502_STABLE
            database: pgsql
          - php: 8.2
            moodle-branch: MOODLE_501_STABLE
            database: pgsql
          - php: 8.2
            moodle-branch: MOODLE_500_STABLE
            database: pgsql
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          PLUGIN_CI_VERSION="${{ matrix.plugin-ci }}"
          PLUGIN_CI_VERSION="${PLUGIN_CI_VERSION:-^4}"
          for attempt in 1 2 3; do
              if composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci "$PLUGIN_CI_VERSION"; then
                  break
              fi
              if [ "$attempt" = 3 ]; then
                  exit 1
              fi
              echo "composer create-project attempt ${attempt} failed, retrying..."
              rm -rf ci
              sleep $((attempt * 15))
          done
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        id: install
        run: |
          for attempt in 1 2 3; do
              if moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1; then
                  exit 0
              fi
              if [ "$attempt" = 3 ]; then
                  exit 1
              fi
              echo "moodle-plugin-ci install attempt ${attempt} failed, retrying..."
              rm -rf moodle moodledata
              sleep $((attempt * 15))
          done
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          IGNORE_PATHS: tests/fixtures

      - name: PHP Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci phpunit

      - name: Behat features
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 3

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
