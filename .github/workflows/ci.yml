name: Codechecker CI

on:
  # Push runs only for main; branches are tested through their pull request,
  # so a push to a branch with an open PR does not run the matrix twice.
  push:
    branches: [main]
  pull_request:

env:
  TZ: Australia/Sydney

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      # Only the database a job uses is started (an empty image skips the
      # service). PostgreSQL 17 / MariaDB 11.4 are the Moodle 5.3 floors and
      # are also supported by Moodle 5.0 - 5.2, so every branch uses them.
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Branch-aware: Moodle 5.2+ dropped PHP 8.2, so 8.2 only runs on 5.0.
        # Each branch is covered on both PostgreSQL and MariaDB across the set.
        #
        # main is deliberately NOT tested: since the MOODLE_503_STABLE cut
        # (5 Oct 2026) main is Moodle 6.0dev, and version.php caps
        # $plugin->supported at 503, so Moodle refuses to install the plugin
        # there. Add main back (with continue-on-error) only when work on
        # 6.0 support starts.
        include:
          - {moodle-branch: 'MOODLE_500_STABLE', php: '8.2', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_501_STABLE', php: '8.4', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql'}
          - {moodle-branch: 'MOODLE_502_STABLE', php: '8.4', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_503_STABLE', php: '8.3', database: 'mariadb'}
          - {moodle-branch: 'MOODLE_503_STABLE', php: '8.4', database: 'pgsql'}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          PLUGIN_CI_VERSION="${{ matrix.plugin-ci }}"
          PLUGIN_CI_VERSION="${PLUGIN_CI_VERSION:-^4}"
          for attempt in 1 2 3; do
              if composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci "$PLUGIN_CI_VERSION"; then
                  break
              fi
              if [ "$attempt" = 3 ]; then
                  exit 1
              fi
              echo "composer create-project attempt ${attempt} failed, retrying..."
              rm -rf ci
              sleep $((attempt * 15))
          done
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        id: install
        run: |
          for attempt in 1 2 3; do
              if moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1; then
                  exit 0
              fi
              if [ "$attempt" = 3 ]; then
                  exit 1
              fi
              echo "moodle-plugin-ci install attempt ${attempt} failed, retrying..."
              rm -rf moodle moodledata
              sleep $((attempt * 15))
          done
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          IGNORE_PATHS: tests/fixtures

      - name: PHP Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() && steps.install.conclusion == 'success' }}
        run: moodle-plugin-ci behat --profile chrome --auto-rerun 3

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
